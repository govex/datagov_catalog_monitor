name: Retrieve Data.gov Catalog

on:
  schedule:
    - cron: '0 07 * * *'  # Runs every day at 02a or 3a ET
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write  # Allows the workflow to push changes to the repository

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      DATA_CACHE_DIR: data  # Directory where all data will be stored

    steps:
      # Check disk space before cleanup
      - name: Check disk space (after startup)
        run: df -h

      # Clean up unnecessary packages to free disk space
      - name: Clean up unnecessary packages
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      # Check disk space after cleanup
      - name: Check disk space (after cleanup)
        run: df -h

      # Get the latest code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Check disk space after checkout
      - name: Check disk space after checkout
        run: df -h

      # Set up Python and enable pip caching to speed up dependency installation
      - name: Set up cached python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      # Check disk space after Python setup
      - name: Check disk space (after Python setup)
        run: df -h

      # Restore previous data from cache
      # there won't be a cache for the current run, so restore-keys is how we get the previous run's cache
      - name: Restore previous data from cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ${{ env.DATA_CACHE_DIR }}
          key: data-catalog-${{ github.run_id }}  # Current run's cache key
          restore-keys: data-catalog-    

      # Install all required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      # Check disk space after dependency installation
      - name: Check disk space (after dependencies)
        run: df -h

      # Retrieve today's data from data.gov
      # This creates a new timestamped folder in data_gov_catalog_ndjson
      - name: Run Python script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          DATA_CACHE_DIR: ${{ env.DATA_CACHE_DIR }}
        run: python scripts/catalog_scan_v2.py

      # Check disk space after data retrieval
      - name: Check disk space (after data retrieval)
        run: df -h

      # Generate statistics by comparing today's data with yesterday's
      - name: Generate Daily Statistics
        env:
          DATA_CACHE_DIR: ${{ env.DATA_CACHE_DIR }}
        run: python scripts/analyze_datagov_catalog/daily_statistics_polars.py

      # Check disk space after statistics generation
      - name: Check disk space (after statistics generation)
        run: df -h

      # Remove yesterday's data, keeping only today's data for tomorrow's comparison
      # ls -t: list files by time (newest first)
      # tail -n +2: select all but the first (newest) entry
      # xargs -r: pass to rm -rf, but only if there are files to remove
      - name: Cleanup Old Data
        run: |
          # Keep only the most recent folder (today's data) in data_gov_catalog_ndjson
          cd ${{ env.DATA_CACHE_DIR }}/data_gov_catalog_ndjson && \
          ls -t | tail -n +2 | xargs -r rm -rf

      # Check disk space after cleanup
      - name: Check disk space (after cleanup)
        run: df -h

      # Check for large files and handle Git LFS tracking
      - name: Handle Git LFS and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          find ${{ env.DATA_CACHE_DIR }}/daily_statistics -type f -exec du -m {} \; | while read size file; do
            if [ "$size" -gt 50 ]; then
              echo "File $file is larger than 50MB, adding to Git LFS"
              echo "  (this should have no effect on already tracked files)"
              git lfs track "$file"
              git add .gitattributes
            fi
          done
          git add ${{ env.DATA_CACHE_DIR }}/daily_statistics
          if ! git diff --cached --quiet; then
            git commit -m "daily statistics update [automated]"
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          else
            echo "No changes to commit"
          fi

      # Check disk space after Git operations
      - name: Check disk space (after Git operations)
        run: df -h

      # Save today's data in cache for the next run
      - name: Save data to cache
        uses: actions/cache/save@v4
        if: success()  # Only cache if the workflow succeeds
        with:
          path: ${{ env.DATA_CACHE_DIR }}
          key: data-catalog-${{ github.run_id }}

      # Final disk space check
      - name: Check disk space (final)
        run: df -h